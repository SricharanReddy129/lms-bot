<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Portal — Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <!-- Toast container -->
  <div id="toast-container" class="position-fixed top-0 end-0 p-3"></div>

  <div class="card login-card shadow-sm">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h4 class="fw-bold mb-1">LMS Portal</h4>
        <p class="text-muted small">Leave Management System</p>
      </div>

      <div id="login-error" class="alert alert-danger d-none py-2" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@company.com" required autocomplete="email">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errDiv   = document.getElementById('login-error');

      errDiv.classList.add('d-none');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const data = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employee_email: email, password }),
        });

        const json = await data.json();

        if (!data.ok) {
          throw new Error(json.detail || 'Invalid credentials');
        }

        saveSession(json);
        window.location.href = '/dashboard';
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Portal — AI Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex flex-column vh-100">

  <!-- Toast container -->
  <div id="toast-container" class="position-fixed top-0 end-0 p-3"></div>

  <!-- Top navbar -->
  <nav class="navbar bg-dark px-3 py-2 d-flex justify-content-between align-items-center">
    <span class="text-white fw-semibold d-flex align-items-center gap-2">
      <i class="bi bi-robot"></i> LMS Chat Assistant
    </span>
    <div class="d-flex gap-2 align-items-center">
      <span id="chat-user-name" class="text-white-50 small me-2"></span>
      <a href="/dashboard" class="btn btn-outline-light btn-sm">
        <i class="bi bi-grid me-1"></i> Dashboard
      </a>
      <button id="logout-btn" class="btn btn-danger btn-sm">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Message window -->
  <div id="chat-messages" class="flex-grow-1 overflow-auto p-4" style="background: #f8f9fa;">
  </div>

  <!-- Typing indicator -->
  <div id="typing-indicator" class="px-4 py-2 text-muted small d-none">
    <span class="fst-italic">Assistant is typing…</span>
  </div>

  <!-- Input bar -->
  <div class="border-top bg-white p-3 d-flex gap-2">
    <input type="text"
           id="chat-input"
           class="form-control"
           placeholder="Ask about your leaves, holidays, or anything LMS related…"
           autocomplete="off">
    <button id="send-btn" class="btn btn-primary px-4 d-flex align-items-center gap-1">
      <i class="bi bi-send"></i>
      <span class="d-none d-sm-inline">Send</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
